<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UK School Term Dates Finder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .search-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 15px 50px 15px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 18px;
            padding: 20px;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .results-info {
            color: #666;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .school-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .school-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .school-header {
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .school-name {
            color: #667eea;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .school-details {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            color: #666;
            font-size: 14px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .section-title {
            font-size: 1.1rem;
            color: #333;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .term-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .inset-section {
            margin-top: 30px;
        }

        .holidays-section {
            margin-top: 30px;
        }

        .term-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
        }

        .term-name {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1rem;
        }

        .term-dates {
            font-size: 0.9rem;
            opacity: 0.95;
        }

        .holidays-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        .holiday-badge {
            background: #fef3e0;
            color: #f59e0b;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .inset-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .inset-badge {
            background: #e0f2fe;
            color: #0284c7;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Autocomplete dropdown styles */
        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            max-height: 350px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            z-index: 1000;
            margin-top: 5px;
        }

        .autocomplete-dropdown.show {
            display: block;
        }

        .autocomplete-item {
            padding: 12px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f5f5f5;
            transition: background 0.2s;
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .autocomplete-item:hover {
            background: #f5f5ff;
        }

        .autocomplete-item-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .autocomplete-item-details {
            font-size: 0.85rem;
            color: #666;
        }

        .autocomplete-no-results {
            padding: 20px;
            text-align: center;
            color: #999;
            font-style: italic;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .search-container {
                padding: 20px;
            }

            .school-card {
                padding: 20px;
            }

            .term-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏫 UK School Term Dates Finder</h1>
        
        <div class="search-container">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search by postcode, school name, or council..."
                    autocomplete="off"
                >
                <span class="search-icon">🔍</span>
                <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
            </div>
            <div id="resultsInfo" class="results-info"></div>
        </div>

        <div id="loading" class="loading" style="display: none;">Loading schools data...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="results"></div>
    </div>

    <!-- External JavaScript -->
    <script src="./public/app.js"></script>
</body>
</html>
